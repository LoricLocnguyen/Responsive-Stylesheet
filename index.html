<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive & Accessible Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Responsive Nature Gallery</h1>
    <p>Exploring landscapes adapted to user accessibility preferences and varying screen sizes.</p>
  </header>

  <main class="grid-container">
    <figure>
      <img src="https://picsum.photos/id/1015/400/300" alt="A quiet river flowing through a lush mountain valley under a blue sky">
      <figcaption>
        <p>A serene mountain river flowing gently through a green valley.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1018/400/300" alt="Pine trees surrounded by heavy blue morning mist in the mountains">
      <figcaption>
        <p>Misty forest pine trees standing tall during early autumn morning.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1025/400/300" alt="A small pug wrapped tightly in a cozy knit blanket looking forward">
      <figcaption>
        <p>A cozy pug enjoying a warm blanket during a cold afternoon.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1039/400/300" alt="A steep waterfall dropping into a crystal clear alpine lake surrounded by rocks">
      <figcaption>
        <p>Crystal clear waterfall cascading into a pristine mountain basin.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1043/400/300" alt="High mountain peaks covered in white snow against a clear sunset sky">
      <figcaption>
        <p>Snow-capped peaks reflecting warm pink light at sunset.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1069/400/300" alt="Calm ocean waves washing onto a sandy beach shore at dusk">
      <figcaption>
        <p>Peaceful ocean tide gently hitting the shore under warm twilight.</p>
      </figcaption>
    </figure>
  </main>
      <div ></div>
</body>
</html>
